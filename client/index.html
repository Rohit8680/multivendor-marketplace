<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusMarket | Multi-Vendor E-Commerce Marketplace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0;">
    <div id="root">
      <!-- Instant Fallback Banner -->
      <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #ffffff; font-family: 'Outfit', sans-serif; min-height: 100vh; padding: 3rem 1.5rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; border-radius: 9999px; padding: 0.4rem 1.2rem; color: #818cf8; font-weight: 700; font-size: 0.85rem; margin-bottom: 1.5rem;">
          ✨ NEXUSMARKET MULTI-VENDOR MARKETPLACE
        </div>
        <h1 style="font-size: 2.8rem; margin-bottom: 0.8rem; color: #ffffff;">Welcome to NexusMarket</h1>
        <p style="color: #94a3b8; font-size: 1.1rem; max-width: 600px; line-height: 1.6; margin-bottom: 2rem;">
          Loading your multi-vendor marketplace experience with verified sellers, Indian Rupee products & Razorpay payment integration...
        </p>
        <div style="display: flex; gap: 1rem;">
          <a href="/products" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #ffffff; padding: 0.8rem 1.6rem; border-radius: 8px; font-weight: 700; text-decoration: none;">Explore Products</a>
          <a href="/login" style="background: rgba(255, 255, 255, 0.1); color: #ffffff; padding: 0.8rem 1.6rem; border-radius: 8px; font-weight: 700; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.2);">Sign In</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
